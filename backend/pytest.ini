[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=common
    --cov=services
    --cov-report=html
    --cov-report=term-missing
markers =
    unit: 单元测试
    api: API接口测试
    integration: 集成测试
    slow: 慢速测试

