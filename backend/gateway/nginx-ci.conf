# CI 网关配置（GitHub Actions Ubuntu runner）
# 与 gateway/nginx-local.conf 路由规则一致，仅替换 macOS 路径为 CI 环境路径：
# - mime.types: /etc/nginx/mime.types
# - 静态文件: /tmp/smart_split_output/ 与 /tmp/data/uploads/
# 使用: sudo nginx -c <本文件绝对路径>
# 前置: 4 个微服务(8001/8002/8003/8006)已启动，静态目录已创建

events {
    worker_connections 1024;
}

http {
    error_log /tmp/nginx_ci_error.log;
    access_log /tmp/nginx_ci_access.log;
    client_body_temp_path /tmp/nginx_body_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    underscores_in_headers on;
    ignore_invalid_headers off;

    upstream auth_backend { server 127.0.0.1:8001; }
    upstream content_backend { server 127.0.0.1:8002; }
    upstream upload_backend { server 127.0.0.1:8003; }
    upstream split_backend { server 127.0.0.1:8004; }
    upstream course_backend { server 127.0.0.1:8005; }
    upstream search_backend { server 127.0.0.1:8006; }
    upstream notification_backend { server 127.0.0.1:8007; }

    server {
        listen 80;
        server_name localhost;

        location /api/auth {
            proxy_pass http://auth_backend/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/feed {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/video {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/interaction {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/follow {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/upload {
            proxy_pass http://upload_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass_request_headers on;
            proxy_set_header upload_id $http_upload_id;
            proxy_set_header chunk_index $http_chunk_index;
            proxy_pass_header upload_id;
            proxy_pass_header chunk_index;
            client_max_body_size 10G;
        }

        location /api/videos/upload {
            proxy_pass http://upload_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 10G;
        }

        location /api/split {
            proxy_pass http://split_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 900s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
        }

        location /smart_split_output/ {
            alias /tmp/smart_split_output/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin *;
        }

        location /uploads/ {
            alias /tmp/data/uploads/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin *;
        }

        location /api/courses {
            proxy_pass http://course_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/search {
            proxy_pass http://search_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/notification {
            proxy_pass http://notification_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/learn {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
