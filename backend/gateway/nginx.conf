events {
    worker_connections 1024;
}

http {
    # MIME类型配置
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    underscores_in_headers on;
    ignore_invalid_headers off;
    
    upstream auth_backend {
        server auth-service:8001;
    }

    upstream content_backend {
        server content-service:8002;
    }

    upstream upload_backend {
        server upload-service:8003;
    }

    upstream split_backend {
        server split-service:8004;
    }

    upstream course_backend {
        server course-service:8005;
    }

    upstream search_backend {
        server search-service:8006;
    }

    upstream notification_backend {
        server notification-service:8007;
    }

    server {
        listen 80;
        server_name localhost;

        # 认证相关接口
        location /api/auth {
            proxy_pass http://auth_backend/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 内容推荐、互动、关注接口
        location /api/feed {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/video {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/interaction {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/follow {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 视频上传接口
        location /api/upload {
            proxy_pass http://upload_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass_request_headers on;
            # 传递自定义请求头
            proxy_set_header upload_id $http_upload_id;
            proxy_set_header chunk_index $http_chunk_index;
            proxy_pass_header upload_id;
            proxy_pass_header chunk_index;
            client_max_body_size 10G;
        }

        location /api/videos/upload {
            proxy_pass http://upload_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 10G;
        }

        # 视频拆分接口
        location /api/split {
            proxy_pass http://split_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # GLM分析可能耗时较长，增加超时时间到15分钟
            proxy_connect_timeout 900s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
        }

        # 静态文件服务 - 切分后的视频片段
        location /smart_split_output/ {
            alias /app/services/split/smart_split_output/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin *;
        }

        # 静态文件服务 - 上传的视频文件
        location /uploads/ {
            alias /app/data/uploads/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin *;
        }

        # 课程管理接口
        location /api/courses {
            proxy_pass http://course_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/learn {
            proxy_pass http://content_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 搜索接口
        location /api/search {
            proxy_pass http://search_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 消息通知接口
        location /api/inbox {
            proxy_pass http://notification_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 静态视频文件
        location /videos/ {
            alias /app/data/videos/;
            expires 1d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

