name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── 后端测试：315 用例全量回归 + 覆盖率门禁（--cov-fail-under=70）──
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 测试环境变量（conftest.py 会自动创建 short_video_platform_test 库）
      DB_USER: postgres
      DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # video_split 用例(9 条)构造 RealVideoSplitService 时校验 ffmpeg,
      # ubuntu runner 镜像不再预装,需显式安装
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run full test suite (315 cases, PostgreSQL integration)
        run: pytest tests/ -q

      # 覆盖率分级门禁：核心业务模块独立底线（防被总量掩盖）
      - name: Check per-module coverage gates
        run: python scripts/check_coverage_gates.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov
          if-no-files-found: warn

  # ── 前端：单测 10 例 + ESLint 0 error + 生产构建（tsc + vite）──
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        run: npm test

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

  # ── E2E 冒烟：Playwright + 真实后端链路（4 服务 + nginx 网关 + 前端 dev server）──
  # 镜像本地开发链路（见 e2e/README.md）：启动 auth/content/upload/search 四个微服务，
  # 灌入 mock 视频数据后经网关跑完整浏览器链路。
  e2e:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: short_video_platform
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password_2025
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 与 docker-compose.yml 的默认凭证一致
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: short_video_platform
      DB_USER: app_user
      DB_PASSWORD: app_password_2025
      REDIS_HOST: 127.0.0.1
      JWT_SECRET_KEY: ci-e2e-secret
      UPLOAD_BASE_DIR: /tmp/data/uploads
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      # direct-split 链路(split.spec.ts)依赖 ffmpeg 切分视频
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install E2E dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Start backend services (auth/content/upload/search/split)
        working-directory: backend
        run: |
          mkdir -p /tmp/data/uploads /tmp/smart_split_output /tmp/nginx_body_temp
          nohup python -m uvicorn services.auth.app.main:app --host 127.0.0.1 --port 8001 > /tmp/svc-auth.log 2>&1 &
          nohup python -m uvicorn services.content.app.main:app --host 127.0.0.1 --port 8002 > /tmp/svc-content.log 2>&1 &
          nohup python -m uvicorn services.upload.app.main:app --host 127.0.0.1 --port 8003 > /tmp/svc-upload.log 2>&1 &
          nohup python -m uvicorn services.split.app.main:app --host 127.0.0.1 --port 8004 > /tmp/svc-split.log 2>&1 &
          nohup python -m uvicorn services.search.app.main:app --host 127.0.0.1 --port 8006 > /tmp/svc-search.log 2>&1 &

      - name: Seed mock videos into database
        working-directory: backend
        run: python scripts/insert_mock_videos.py

      - name: Start Nginx gateway
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx > /dev/null
          # 停掉 apt 自动启动的默认 nginx，改用 CI 网关配置
          sudo systemctl stop nginx || true
          sudo pkill nginx || true
          sudo mkdir -p /tmp/data/uploads /tmp/smart_split_output /tmp/nginx_body_temp
          sudo chmod -R 777 /tmp/data /tmp/smart_split_output /tmp/nginx_body_temp
          sudo nginx -c $GITHUB_WORKSPACE/backend/gateway/nginx-ci.conf

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/vite.log 2>&1 &

      - name: Wait for stack readiness
        run: |
          # 网关 → content → DB 链路就绪（最多等 60s）
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/feed/recommend > /dev/null; then
              echo "✅ gateway + content + DB ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "❌ gateway not ready after 60s"
              cat /tmp/svc-auth.log /tmp/svc-content.log /tmp/svc-upload.log /tmp/svc-search.log 2>/dev/null
              exit 1
            fi
            sleep 2
          done
          curl -sf http://localhost:3000 > /dev/null && echo "✅ frontend ready"
          # 预热 vite 冷编译（首次访问需编译 1500+ 模块，避免测试与编译竞争）
          for route in /login / /search /upload; do
            curl -sf -o /dev/null "http://localhost:3000$route" || true
          done
          echo "✅ frontend routes warmed up"

      - name: Run Playwright E2E suite
        working-directory: e2e
        run: npx playwright test

      - name: Upload E2E traces/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore
